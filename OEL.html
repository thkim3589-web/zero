<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>전송 현장운용 시험문제</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1A20">
<style>
  :root{
    --bg: #0B1418;
    --panel: #12222A;
    --panel-2: #16303A;
    --line: #234049;
    --text: #E9F2F2;
    --muted: #7FA3AA;
    --accent: #3FD6C4;
    --accent-dim: #1F5A54;
    --amber: #F0A94E;
    --red: #E8685E;
    --green: #5FCB8C;
    --radius: 14px;
    font-size: 16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 100% -10%, #123038 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #0f2a2f 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    width:100%;
    padding: 18px 16px 40px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 4px 2px 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  header.top .mark{
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  header.top h1{
    font-size: 19px;
    margin: 2px 0 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.top .stat{
    text-align:right;
    font-size: 12px;
    color: var(--muted);
    line-height:1.5;
  }
  header.top .stat b{ color: var(--text); font-size:14px; }

  /* ---------- Setup screen ---------- */
  .section-title{
    font-size: 13px;
    color: var(--muted);
    margin: 22px 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-title .link{
    color: var(--accent);
    font-size:12px;
    cursor:pointer;
  }
  .cat-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .cat-item{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 14px;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .cat-item.on{
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(63,214,196,0.10), rgba(63,214,196,0.03));
  }
  .cat-item .box{
    width:20px; height:20px; border-radius:6px;
    border: 1.5px solid var(--line);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    color: var(--bg);
  }
  .cat-item.on .box{ background:var(--accent); border-color:var(--accent); }
  .cat-item .box svg{ width:13px; height:13px; display:none; }
  .cat-item.on .box svg{ display:block; }
  .cat-item .name{ flex:1; font-size:15px; font-weight:600; }
  .cat-item .count{ font-size:12px; color:var(--muted); font-variant-numeric: tabular-nums; }
  .cat-item .wrongbadge{
    font-size:11px; color: var(--amber); background: rgba(240,169,78,0.12);
    border:1px solid rgba(240,169,78,0.35); border-radius:100px; padding:2px 8px;
  }

  .count-row{ display:flex; gap:8px; }
  .count-chip{
    flex:1;
    text-align:center;
    padding: 12px 6px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 14px;
    font-weight:600;
    cursor:pointer;
  }
  .count-chip.on{ border-color: var(--accent); color: var(--accent); background: rgba(63,214,196,0.08); }

  .toggle-item{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 14px;
    cursor:pointer;
  }
  .toggle-text{ flex:1; }
  .toggle-title{ font-size:14.5px; font-weight:600; }
  .toggle-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .switch{
    width:44px; height:26px; border-radius:100px;
    background: var(--line);
    flex:0 0 auto;
    position:relative;
    transition: background .18s ease;
  }
  .switch .knob{
    position:absolute; top:3px; left:3px;
    width:20px; height:20px; border-radius:50%;
    background: var(--muted);
    transition: transform .18s ease, background .18s ease;
  }
  .switch.on{ background: var(--accent-dim); }
  .switch.on .knob{ transform: translateX(18px); background: var(--accent); }

  .qhead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }
  .qhead .tag{ margin-bottom:0; }
  .ahead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 8px;
  }
  .ahead-label{ font-size:11.5px; color:var(--muted); font-weight:700; letter-spacing:.02em; }
  .speak-btn{
    width:32px; height:32px;
    border-radius:50%;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
    padding:0;
  }
  .speak-btn svg{ width:16px; height:16px; }
  .speak-btn.speaking{
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(63,214,196,0.10);
  }
  .speak-btn.speaking .wave{ animation: speakpulse 1s ease-in-out infinite; }
  .speak-btn.speaking .wave:nth-child(3){ animation-delay: .15s; }
  @keyframes speakpulse{
    0%, 100%{ opacity: .45; }
    50%{ opacity: 1; }
  }

  .start-btn{
    margin-top: 26px;
    width:100%;
    padding: 16px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #06201C;
    font-size: 16px;
    font-weight: 700;
    cursor:pointer;
    letter-spacing: -0.01em;
  }
  .start-btn:disabled{ background: var(--line); color: var(--muted); }
  .start-sub{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:10px; }

  /* ---------- Quiz screen ---------- */
  .progress-row{
    display:flex; align-items:center; gap:10px; margin-bottom: 16px;
  }
  .progress-bar{
    flex:1; height:5px; background: var(--line); border-radius:100px; overflow:hidden;
  }
  .progress-bar > div{ height:100%; background: var(--accent); transition: width .25s ease; }
  .progress-num{ font-size:12.5px; color:var(--muted); font-variant-numeric: tabular-nums; white-space:nowrap; }

  .qcard{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px 20px;
    flex:1;
    display:flex;
    flex-direction:column;
    min-height: 320px;
  }
  .qcard .tag{
    display:inline-flex;
    align-self:flex-start;
    font-size:11.5px;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    background: rgba(63,214,196,0.08);
    padding: 4px 10px;
    border-radius: 100px;
    margin-bottom: 14px;
    font-weight:600;
  }
  .qtext{
    font-size: 16.5px;
    line-height:1.62;
    white-space: pre-wrap;
    word-break: keep-all;
    color: var(--text);
  }
  .divider{
    border:none; border-top:1px solid var(--line);
    margin: 18px 0;
  }
  .atext{
    font-size: 15.5px;
    line-height:1.65;
    white-space: pre-wrap;
    word-break: keep-all;
    color: #CFEDE9;
    background: var(--panel-2);
    border-radius: 12px;
    padding: 14px 15px;
    border: 1px solid var(--accent-dim);
  }
  .spacer{flex:1;}

  .reveal-btn{
    margin-top:18px;
    width:100%;
    padding:15px;
    border-radius: 12px;
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--muted);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .reveal-btn:active{ background: var(--panel-2); }

  .judge-row{
    margin-top:18px;
    display:flex;
    gap:10px;
  }
  .judge-btn{
    flex:1;
    padding:15px 8px;
    border-radius:12px;
    border:1px solid var(--line);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    background: var(--panel);
    color: var(--text);
  }
  .judge-btn.wrong{ color: var(--red); }
  .judge-btn.right{ color: var(--green); }
  .judge-btn.wrong:active{ background: rgba(232,104,94,0.12); border-color: var(--red); }
  .judge-btn.right:active{ background: rgba(95,203,140,0.12); border-color: var(--green); }

  .bottom-nav{
    display:flex;
    justify-content:space-between;
    margin-top: 14px;
    gap:10px;
  }
  .ghost-btn{
    background:none; border:none; color:var(--muted); font-size:13.5px; padding:8px 4px; cursor:pointer;
  }

  /* ---------- Result screen ---------- */
  .result-hero{
    text-align:center;
    padding: 30px 10px 8px;
  }
  .result-hero .score{
    font-size:52px;
    font-weight:800;
    color: var(--accent);
    letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
  }
  .result-hero .score span{ font-size:22px; color:var(--muted); font-weight:600; }
  .result-hero .label{ color:var(--muted); font-size:13.5px; margin-top:6px; }

  .result-row{
    display:flex; gap:10px; margin: 22px 0 8px;
  }
  .result-stat{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px; text-align:center;
  }
  .result-stat .n{ font-size:22px; font-weight:800; font-variant-numeric: tabular-nums; }
  .result-stat.wrong .n{ color: var(--red); }
  .result-stat.right .n{ color: var(--green); }
  .result-stat .t{ font-size:11.5px; color:var(--muted); margin-top:3px; }

  .review-item{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 15px; margin-bottom:10px;
  }
  .review-item .rtag{ font-size:11px; color:var(--amber); font-weight:700; margin-bottom:6px; }
  .review-item .rq{ font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-break:keep-all; margin-bottom:8px; }
  .review-item .ra{ font-size:13.5px; line-height:1.55; white-space:pre-wrap; word-break:keep-all; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px; }

  .btn-row{ display:flex; gap:10px; margin-top:22px; }
  .btn-row .start-btn{ margin-top:0; }
  .secondary-btn{
    flex:1; padding:16px; border-radius: var(--radius); border:1px solid var(--line);
    background:transparent; color:var(--text); font-size:15px; font-weight:700; cursor:pointer;
  }

  .hidden{ display:none !important; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="mark">OEL · 전송 현장운용</div>
      <h1>시험문제 출제</h1>
    </div>
    <div class="stat" id="headerStat">전체 <b>688</b>문항</div>
  </header>

  <!-- ================= SETUP SCREEN ================= -->
  <div id="screen-setup">
    <div class="section-title">
      <span>출제 범위</span>
      <span class="link" id="selectAllBtn">전체선택</span>
    </div>
    <div class="cat-grid" id="catGrid"></div>

    <div class="section-title">문항 수</div>
    <div class="count-row" id="countRow">
      <div class="count-chip" data-n="10">10문제</div>
      <div class="count-chip" data-n="20">20문제</div>
      <div class="count-chip" data-n="30">30문제</div>
      <div class="count-chip" data-n="0">전체</div>
    </div>

    <div class="section-title">읽어주기</div>
    <div class="toggle-item" id="autoReadToggle">
      <div class="toggle-text">
        <div class="toggle-title">문제 자동 읽어주기</div>
        <div class="toggle-sub">문제가 나올 때 음성으로 자동 재생합니다</div>
      </div>
      <div class="switch" id="autoReadSwitch"><div class="knob"></div></div>
    </div>

    <button class="start-btn" id="startBtn">시험 시작</button>
    <div class="start-sub" id="startSub">문제는 매번 무작위 순서로 출제됩니다</div>
  </div>

  <!-- ================= QUIZ SCREEN ================= -->
  <div id="screen-quiz" class="hidden" style="flex:1; display:flex; flex-direction:column;">
    <div class="progress-row">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div class="progress-num" id="progressNum">1 / 10</div>
    </div>

    <div class="qcard">
      <div class="qhead">
        <span class="tag" id="qTag">표준공법</span>
        <button class="speak-btn" id="speakQBtn" aria-label="문제 읽어주기">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="wave" d="M18.3 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="qtext" id="qText"></div>

      <div id="answerBlock" class="hidden">
        <hr class="divider">
        <div class="ahead">
          <span class="ahead-label">정답 및 해설</span>
          <button class="speak-btn" id="speakABtn" aria-label="정답 읽어주기">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="wave" d="M18.3 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="atext" id="aText"></div>
      </div>

      <div class="spacer"></div>

      <button class="reveal-btn" id="revealBtn">정답 확인하기</button>

      <div class="judge-row hidden" id="judgeRow">
        <button class="judge-btn wrong" id="wrongBtn">✕ 틀렸어요</button>
        <button class="judge-btn right" id="rightBtn">✓ 맞혔어요</button>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="ghost-btn" id="quitBtn">범위 다시 선택</button>
      <button class="ghost-btn" id="skipBtn">건너뛰기 →</button>
    </div>
  </div>

  <!-- ================= RESULT SCREEN ================= -->
  <div id="screen-result" class="hidden">
    <div class="result-hero">
      <div class="score" id="resultScore">0<span>%</span></div>
      <div class="label">정답률</div>
    </div>
    <div class="result-row">
      <div class="result-stat right"><div class="n" id="rightCount">0</div><div class="t">맞힌 문제</div></div>
      <div class="result-stat wrong"><div class="n" id="wrongCount">0</div><div class="t">틀린 문제</div></div>
    </div>

    <div id="reviewSection" class="hidden">
      <div class="section-title">오답 다시보기</div>
      <div id="reviewList"></div>
    </div>

    <div class="btn-row">
      <button class="secondary-btn" id="restartBtn">범위 다시 선택</button>
      <button class="start-btn" id="retryWrongBtn">오답만 다시 풀기</button>
    </div>
  </div>

</div>

<script id="quiz-data" type="application/json">[{"category": "표준공법", "question": "관로 지중 표시기 설치시 관로의 굴착거리가 10m 초과인 경우 최초 굴착 지점으로부터 ( 가 )m를 이격하여 첫번째 지중표시기를 설치한다. 최초 지중표시기 설치 이후부터 (  나  )m 마다 설치 한다.   \n\n가 : 5m 나 : 10m", "answer": "[정답]\n가 5, 나 10", "keyword": "표준공법"}, {"category": "표준공법", "question": "지중선로 표시기 설치 위치(도로법 27조 별표4 적용)에 대한 설명이 아닌것은 찾으시오.\n1. 보도가 있는 도로는 경계석 상부 중앙에 부착\n2. 보도가 없는 도로는 도로측 방향 경계석 하단 부착\n3. 비포장 구간은 표지주를 매설물 바로위나 길어깨끝 또는 절토부 소단에 설치\n4. 지중표시기 간격은 경계석은 10m간격, 비포장구간 표지주 20m마다 설치", "answer": "[정답]\n2\n(1) 지중선로표시기 설치 간격\n관로시설 전체구간에 적용하며, 10m 간격으로 시설함을 원칙으로 하되, 관계기관의 요구가 있는 경우에는 그에 따라 설치할 수 있으며, 도로횡단, 교차로, 굴곡구간은 유지보수가 용이토록 설치간격을 조정 할 수 있다.\n(2) 지중선로 표시기 설치 위치(도로법 27조 별표4 적용)\n1) 보도가 있는 도로 : 매설물까지의 거리를 표시한 인식표지를 경계석 상부 중앙에 부착하고, \n2) 보도가 없는 도로 : 매설물 직상에 설치   \n3) 비포장 구간 : 매설물까지의 거리를 표시한 표지주를 매설물의 바로위나 길어깨끝 또는 절토부 소단에  20m마다 설치", "keyword": "표준공법"}, {"category": "표준공법", "question": "한전주에 설치 하는 광케이블과 전력선과의 이격거리가 틀린것을 찾으시오.\n\n가) 특고압(7000V)이상 -> 이격거리 1.2m 이상\n나) 고압(600V 초과) 강전류 전선 -> 0.6m 이상\n다) 저압 또는 특고압 다중 접지 주중 중선선 -> 0.6m 이상\n라) 저압 인입선(600V)이하 -> 0.3m이상", "answer": "[정답]\n라", "keyword": "표준공법"}, {"category": "표준공법", "question": "케이블 명찰 취부에 관련 내용 중 틀린것을 찾으시오.\n\n1. 케이블 명찰은 전주 중심에서 50cm 이경을 두어 설치 \n2. 시내권 5경간마다 취부\n다, 케이블 종단처리 지점, 접속함체 시설지점, 건물 인입 구간 매 개소마다 취부\n4. 맨홀은 매 맨홀마다 취부", "answer": "[정답]\n나\n\nㅇ 케이블 명찰취부\n1) 전주에는 명찰을 부착해야 하며 식별이 용이하도록 한다.\n2) 케이블 명찰은 바인드선을 이용하여 견고하게 취부 한다.\n3) 케이블 명찰은 전주 중심에서 50cm 이격을 두어 시내권은 매전주, 시외는 5경간 마다 취부하며, 케이블 종단처리 지점, 접속함체 시설지점, 건물인입 구간 등 케이블 구별이 필요한 개소마다 취부한다. (단, 한전의 명찰취부 별도 요청시 요청대로 시행한다)\n지중시설에 대해서는 맨홀은 매 맨홀마다, 전력구나 공동구내의 행거에는 50m 마다 취부한다.", "keyword": "표준공법"}, {"category": "표준공법", "question": "횡단구간 위험표시판을 부착시 기준이 틀린것을 찾으시오.\n\n1. 조가선 신설 구간에는 차선 수와 상관없이 상/하행선 각가 1개씩 시설\n2. 조가선 신설 구간 타사 위험표지판이 시설되어 있으면 별도로 시설하지 않는다\n다. 위험표지판은 조가선에 시설한다\n4. 상/하행선 구분이 있는 도로에는 각각 1개씩 시설한다.", "answer": "[정답]\n나\n\nㅇ 횡단구간 등 주요개소와 취약개소에는 위험표시판을 부착하며 위험표시판은 황색 PP재질 명찰에 적색글씨로 인쇄한다.\n가)  상/하행선 구분이 있는 도로에는 각각 1개씩 시설한다. (타사 위험표지판이 시설되어 있더라도 당사 위험표지판을 추가로 시설한다.).)\n나)  기설 조가선인 경우 6차선 이상의 횡단개소 시공시에는 상/하행선을 구분하여 타사가 시설되어 있지 않더라도 별도로 시설하지 않는다.\n다)  조가선 신설 구간에는 차선 수와 관계없이 상/하행선 각각 1개씩 위험표지판을 시설한다.\n[2018.5.5 개정]\n5) 위험표시판은 조가선에 시설한다.\n※ 위험표시판은 상단 3개의 모든 구멍을 바인드선으로 조가선에 견고하게 취부 한다.", "keyword": "표준공법"}, {"category": "표준공법", "question": "자가주(IP주) 횡단구간 주변 환경 변화에 따른 지상고 미달 발생시 높임철물(보강철주) 활용하여 지상고 상향하려고 한다. SKT 기준 높임철물(보강철주) 종류가 아닌것을  고르시오.\n\n 1. 1.0m 높임철물     2. 1.2m 높임철물     다.  1.5m 높임철물         4. 곡형 높임철물", "answer": "[정답]\n2.\n\n높임 철물(보강철주) 규격은  1.0m, 1.5m 2종류\n저압, 간판 등으로 직선형 높임 철물 사용 불가시 곡형 높임철물 사용(저압 케이블  이격 0.3m 확보)", "keyword": "표준공법"}, {"category": "표준공법", "question": "자가주/통신주(IP) 건식 후  주변 환경에 따른 지상고 미달시 사용하는 금구류는?  보강철주", "answer": "[정답]\n지상고 높임철물(or 높임철물) or 보강철주 \n\n*인상갓은 비속어 입니다. 사용 주의\n\nㅇ 지상고 높임철물(보강철주)\n1) 자가주(IP주) 건식 후 주변 환경변화에 따른 지상고 미달 시 적용하여 지상고를 확보한다.\n2) 지상고 높임 철물은 기설 전주의 지상고가 확보되지 않은 경우에 사용하고, 자가주 신규\n건식시에는 지상고 확보를 위한 적정한 길이의 전주(IP/CP)를 시설하여야 한다.", "keyword": "표준공법"}, {"category": "표준공법", "question": "종말주에서 건물 인입케이블을 설치 고정에 대한 설명입니다. 아래 ()안에 들어갈 말을 적으시오.\n\n전주측 조가선 분기점으로부터 고객측 인입점까지 30m 미만은 (  가   ), 30m 이상 또는 앙각이 30도 초과되는 등 과도한 장력이 발생되는 경우는 (   나  )를 사용하여 설치한다. 10m이상 30m 미만 도로 횡단 구간의 경우 (  나    )를 이용하여 설치한다.\n케인크 /  와이어", "answer": "[정답]\n1. 케인크, 2. 와이어로프(와이어)\n\nㅇ 추가 설명\n가) 30m 미만 구간은 케인크를 이용하여 설치한다.\n나) 인입 30m 이상 구간은 와이어를 이용하여 설치한다.\n다) 기설 와이어 이용 가능한 경우는 이를 이용하여 바인딩 한다.\n라) 10m 이상 30m 미만 도로 횡단 구간일 경우 와이어를 이용하여 설치한다.", "keyword": "표준공법"}, {"category": "표준공법", "question": "전주 입상 구간 반경철관 기준이 아닌것을 찾으시오.\n\n1. 반경철관은 2m 1개 사용을 기준으로 하고, 여건에 따라 2m의 반경철관을 2개 사용\n2. 광케이블 포설은 상부국에서 하부국으로 포설하는 것을 원칙으로 한다.\n3. 한전주에 여장 케이블을 절대 두지 않음을 원칙으로 한다\n4. 광케이블 포설은 10m/분 이하의 균일한 속도로 포설", "answer": "[정답]\n1\n\nㅇ 전주입상개소에는 Size 2.5m 1개 사용을 기준으로 하고, 여건에 따라 2m의 반경철관을 2개사용하여 반경관 취부밴드로 2개소를 견고히 묶어 고정시킨다. 단, IP전주 입상개소는 반경철관 1개를 시설한다.", "keyword": "표준공법"}, {"category": "표준공법", "question": "전주 건식 설계시 고려사항이 아닌것을 찾으시오.\n\n1. 도로 교차점,주위의 미관을 저해되는 장소는 피하여 건식\n2. 횡단구간은 8m IP전주를 기준으로 하되, 현장여건에 따라 7~16m전주를 건식 할 수 있다.\n3. 시내 가공선로 주간거리 기준은 40m 이하로 기준\n4.전주의 하중분담은 지선 설치시 전주 10%, 지선 90%로 설치한다", "answer": "[정답]\n2\n\n\nㅇ 횡단구간은 10m이상의 콘크리트 전주를 건식해야하며, 도로변 구간은 8m IP전주를 기준으로 하되, 현장여건에 따라 7~9m전주를 건식 할 수 있다.", "keyword": "표준공법"}, {"category": "표준공법", "question": "전주의 매설 깊이 및 방향에 대한 설명이 다른것을 찾으시오.\n\n1. 전주의 매설 깊이는 전주 길이의 1/6 깊이로 매설\n2. 매설 깊이는 최소 1m, 최대 2.5m 깊이로 매설\n3. 논,성토지, 연약지반의 경우는 전주 길이의 1/5로 매설\n4. 암반,연약지대 매설깊이 규정 불가시 보호콘크리트를 시공", "answer": "[정답]\n2. \n\nㅇ 전주의 매설 깊이는 보통 지반에서 전주 길이의 1/6을 표준으로 하고 매설 깊이의 최소한도는 1.2m이고 최대한도는 2.5m이다.", "keyword": "표준공법"}, {"category": "표준공법", "question": "OTDR 측정을 위해 파라미터 값 설정 시 기설(혼압) 케이블의 굴절률 설정값 기준은?\n 1. 1.4679nm  2.1.4827nm   3.1.4919nm   4. 1.4723nm", "answer": "[정답]\n1", "keyword": "표준공법"}, {"category": "표준공법", "question": "자가주구간 입상관 설치시 IP 전주와  CP전주에 관로 크기가 맞는 것을 찾으시오. \n\n1. 50mm / 80mm\n2. 80mm / 100mm\n3. 50mm / 100mm\n4. 80mm / 150mm", "answer": "정답)\n3\n\n입상지점에 한전주가 없어 자가주 건식 시에는 입상관이 50mm관일 경우 IP전주, 100mm관일 경우 CP주를 원칙으로 한다", "keyword": "표준공법"}, {"category": "표준공법", "question": "일반 시설기준 강관주 8m이상 설계하중은?   150kg", "answer": "정답)\n - 150kg", "keyword": "표준공법"}, {"category": "표준공법", "question": "표준공법 광케이블 시험 손실치는?\n\n가) 1310nm : 케이블 손실 (    0.4  dB/km) + 접속점 손실(       0.1  dB)\n나) 1550nm : 케이블 손실 (    0.3  dB/km) + 접속점 손실(       0.1  dB)", "answer": "[정답]\n - 1310nm : 케이블 손실 (0.4dB/km) + 접속점 손실(0.1dB)\n - 1550nm : 케이블 손실 (0.3dB/km) + 접속점 손실(0.1dB)", "keyword": "표준공법"}, {"category": "표준공법", "question": "지선의 종류와 설명이 다른것은?\n\n 1. 도월지선 : 곡선로의 전주에 지형상 지선의 설치가 불가능할 경우 설치한다\n 2. 3방지선과 4방지선 : 구간거리가 긴 구간이나 철도 횡단 등 견고를 요구하는 전주에 설치한다\n 3. 인지지선 : 전선의 각도가 120˚ 미만일 경우 인지지선을 설치한다.\n 4. 양측지선 : 폭설, 강풍등 기타의 원인에 의해 가공선로가 끊어졌을떄 전주가 연쇄적으로 넘어지는 피해를 예방하기 위해 설치한다.", "answer": "[정답]\n4\n\n지선의 종류  \nA. 인지지선\n전선의 각도가 120˚ 미만일 경우 인지지선을 설치한다.\n \nB. 편지선\n- 곡선주에 필요한 시설에 설치된 편지선은 인지지선에 준한 시공방법에 의해 추가할 수 있다.\n- 표준근개각도는 45˚로 하되 25˚이하는 피해야 한다.\n- 전선의 각도가 175˚이상이면 직선으로 본다\n \nC. 양측지선\n① 종 풍압 적용지역의 격주 또는 2본 격주마다 적용한다.\n② 을종 풍압 적용지역의 2본 격주마다 적용한다.\n③ 중계장치 및 유도 중화코일 설치주는 그들이 가하여 지는 풍압하중을 계산한 후 필요한 경우에만 적용한다.\n㈜ 전선각도 175˚이상의 곡선로에는 선로와 직각방향으로 근개각도 45˚로 설치한다. \n \nD. 양종지선\n① 해당 전주가 곡선주인 경우는 각 선로방향의 인지지선으로 한다.\n② 갑종 및 을종 풍압하중 적용지에 있어서는 상부인지주로부터 20본째 마다 전주에 설치한다.\n③ 커티너어리(Catenary) 양단의 전주에 설치한다.\n④ 기타, 경사지 등 지황상 양종지선의 설치가 필요한 경우\n㈜ 폭설, 강풍등 기타의 원인에 의해 가공선로가 끊어졌을떄 전주가 연쇄적으로 넘어지는 피해를 예방하기 위해 설치한다.\n \nE. 3방지선과 4방지선\n㈜ 구간거리가 긴 구간이나 철도 횡단등 견고를 요하는 전주에 설치하며 3방지선의 경우 1가닥은 선로와 동일방향, 나머지 2가닥은 120˚방향으로 설치한다.\n㈜ 4방지선의 두가닥은 선로방향, 다른 두가닥은 선로와 직각 방향으로 설치한다.\n \nF. 도월지선 : 곡선로의 전주에 지형상 지선의 설치가 불가능할 경우 설치한다.\n㈜ 가공선로를 부득이 도로 기타등을 횡단해서 지선을 설치 해야할 경우 도로건너편에 지선주와 추지선을 설치하며 수평지선의 근개각도는 90˚로 하고 추지선의 근개각도는 30˚로 한다.", "keyword": "표준공법"}, {"category": "표준공법", "question": "차선이 있는 도로 횡단 구간내 가공 광케이블 구성시 광케이블 설치높이 기준으로 올바른것을 고르시오.\n\n1. 5.5M\n2. 5.6M\n3. 6.5M\n4. 6.6M", "answer": "[정답]\n4", "keyword": "표준공법"}, {"category": "표준공법", "question": "교량첨가 공법으로 틀린것은?\n\n1. 교량 중앙의 규정 토피 지점(1.0m) 이상 구간에서는 FC관을 사용하고 보도 콘크리트로 관을 보호한다.\n2. 장대교에서는 신축방지를 위하여 18m간격으로 신축에 이음소켓트를 사용 접속한다.\n3. 일반 지지점은 2m간격으로 설치하여 지지점이 받는 충격을 완화시키고 타구간에서의 진동 전달을 방지하기 위해 방진고무를 설치한다.\n4. 장대교 교량은 20m 간격으로 특수지지점을 두어 진동 및 관측 방향으로 이동을 방지토록 교량에 관을 고정시킨다.", "answer": "[정답]\n1\n\n교량첨가\n교랑첨가 장치로 설계도면에 의거 견고하게 설치한다.\n가) 교량 끝에서 규정 토피 지점(1.0m)미만 구간에서는 FC관을 사용하고 보도 콘크리트로 관을 보호한다.\n나) 토피 부족구간 관로 곡점 교각은 가능한 5。이내로 하고 곡률반경은 15m 이상으로 한다.\n다) 장대교에서는 신축방지를 위하여 18m간격으로 신축에 이음소켓트를 사용 접속한다.\n라) 일반 지지점은 2m간격으로 설치하여 지지점이 받는 충격을 완화시키고 타구간에서의 진동 전달을 방지하기 위해 방진고무를 설치한다.\n마) 장대교 교량은 20m 간격으로 특수지지점을 두어 진동 및 관측 방향으로 이동을 방지토록 교량에 관을 고정시킨다.", "keyword": "표준공법"}, {"category": "표준공법", "question": "다음 그림은 장주별 금구류 설치방법 중 하나로 명칭과 용도를 적으시오.  E장주  간판이나 장애물로 부터 이격이 필요한 전주", "answer": "[정답]\nE장주 : 간판 등 장애물로 인해 케이블을 지지물로부터 이격시킬 필요가 있는 주", "keyword": "표준공법"}, {"category": "표준공법", "question": "다음 내용에 (                  ) 괄호 내에 알맞은 답을 적으시오.\n\n『 조가선에 차량접촉등으로 발생되는 장력으로부터 전주를 보호하기 위해 도로 2차선 이상 횡단개소에 한해서  (              )를 사용하며 해당 적용구간은 한전 공가 승인 조건에 명시된 구간에 적용한다. 도로 형태에 따라 단방향과 양방향 (              )를 사용한다. 』\n\n장력이탈밴드", "answer": "[정답]\n장력이탈 밴드\n\n조가선에 차량접촉등으로 발생되는 장력으로부터 전주를 보  사항", "keyword": ""}]</script>
<script>
(function(){
  const ALL = JSON.parse(document.getElementById('quiz-data').textContent);
  const CATS = [...new Set(ALL.map(d=>d.category))];

  // assign stable ids
  ALL.forEach((d,i)=> d._id = i);

  const LS_WRONG = 'oel_quiz_wrongnote_v1';
  function loadWrongIds(){
    try{ return JSON.parse(localStorage.getItem(LS_WRONG) || '[]'); }catch(e){ return []; }
  }
  function saveWrongIds(arr){
    localStorage.setItem(LS_WRONG, JSON.stringify([...new Set(arr)]));
  }

  let selectedCats = new Set(CATS);
  let selectedCount = 0; // 0 = all
  let queue = [];
  let idx = 0;
  let rightN = 0, wrongN = 0;
  let wrongItemsThisRound = [];
  let revealed = false;
  let usingWrongNoteMode = false;

  const screenSetup = document.getElementById('screen-setup');
  const screenQuiz = document.getElementById('screen-quiz');
  const screenResult = document.getElementById('screen-result');
  const headerStat = document.getElementById('headerStat');

  // ---------- 읽어주기 (TTS) ----------
  const LS_AUTOREAD = 'oel_quiz_autoread_v1';
  const ttsSupported = ('speechSynthesis' in window);
  let autoRead = localStorage.getItem(LS_AUTOREAD) === '1';
  let currentSpeakBtn = null;
  let koVoice = null;

  function pickKoVoice(){
    if(!ttsSupported) return;
    const voices = speechSynthesis.getVoices();
    koVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ko')) || null;
  }
  if(ttsSupported){
    pickKoVoice();
    speechSynthesis.onvoiceschanged = pickKoVoice;
  }

  function cleanForSpeech(text){
    return text
      .replace(/\[정답\]|\[정담\]/g, '정답,')
      .replace(/\n+/g, '. ')
      .trim();
  }

  function setSpeakBtnState(btn, speaking){
    if(!btn) return;
    btn.classList.toggle('speaking', speaking);
  }

  function stopSpeaking(){
    if(!ttsSupported) return;
    speechSynthesis.cancel();
    setSpeakBtnState(currentSpeakBtn, false);
    currentSpeakBtn = null;
  }

  function speak(text, btn){
    if(!ttsSupported) return;
    const wasSameBtn = (currentSpeakBtn === btn);
    speechSynthesis.cancel();
    setSpeakBtnState(currentSpeakBtn, false);
    currentSpeakBtn = null;
    if(wasSameBtn) return; // acted as a stop toggle

    const utter = new SpeechSynthesisUtterance(cleanForSpeech(text));
    utter.lang = 'ko-KR';
    if(koVoice) utter.voice = koVoice;
    utter.rate = 1;
    utter.onend = () => setSpeakBtnState(btn, false);
    utter.onerror = () => setSpeakBtnState(btn, false);
    currentSpeakBtn = btn;
    setSpeakBtnState(btn, true);
    speechSynthesis.speak(utter);
  }

  const speakQBtn = document.getElementById('speakQBtn');
  const speakABtn = document.getElementById('speakABtn');
  if(!ttsSupported){
    speakQBtn.classList.add('hidden');
    speakABtn.classList.add('hidden');
    document.getElementById('autoReadToggle').classList.add('hidden');
  }
  speakQBtn.addEventListener('click', ()=>{
    speak(document.getElementById('qText').textContent, speakQBtn);
  });
  speakABtn.addEventListener('click', ()=>{
    speak(document.getElementById('aText').textContent, speakABtn);
  });

  const autoReadSwitch = document.getElementById('autoReadSwitch');
  function renderAutoReadSwitch(){
    autoReadSwitch.classList.toggle('on', autoRead);
  }
  document.getElementById('autoReadToggle').addEventListener('click', ()=>{
    autoRead = !autoRead;
    localStorage.setItem(LS_AUTOREAD, autoRead ? '1' : '0');
    renderAutoReadSwitch();
  });
  renderAutoReadSwitch();

  function renderCatGrid(){
    const wrongIds = loadWrongIds();
    const wrongByCat = {};
    wrongIds.forEach(id=>{
      const item = ALL[id];
      if(item){ wrongByCat[item.category] = (wrongByCat[item.category]||0) + 1; }
    });

    const grid = document.getElementById('catGrid');
    grid.innerHTML = '';
    CATS.forEach(cat=>{
      const n = ALL.filter(d=>d.category===cat).length;
      const on = selectedCats.has(cat);
      const wn = wrongByCat[cat] || 0;
      const div = document.createElement('div');
      div.className = 'cat-item' + (on ? ' on' : '');
      div.innerHTML = `
        <div class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="name">${cat}</div>
        ${wn ? `<div class="wrongbadge">오답 ${wn}</div>` : ''}
        <div class="count">${n}문항</div>
      `;
      div.addEventListener('click', ()=>{
        if(selectedCats.has(cat)) selectedCats.delete(cat);
        else selectedCats.add(cat);
        renderCatGrid();
        updateStartState();
      });
      grid.appendChild(div);
    });
  }

  document.getElementById('selectAllBtn').addEventListener('click', ()=>{
    if(selectedCats.size === CATS.length){ selectedCats.clear(); }
    else { selectedCats = new Set(CATS); }
    renderCatGrid();
    updateStartState();
  });

  document.querySelectorAll('.count-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.count-chip').forEach(c=>c.classList.remove('on'));
      chip.classList.add('on');
      selectedCount = parseInt(chip.dataset.n, 10);
    });
  });
  // default: 전체 selected
  document.querySelector('.count-chip[data-n="0"]').classList.add('on');

  function updateStartState(){
    const pool = ALL.filter(d=>selectedCats.has(d.category));
    const btn = document.getElementById('startBtn');
    btn.disabled = pool.length === 0;
    headerStat.innerHTML = `선택 <b>${pool.length}</b>문항`;
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{
    usingWrongNoteMode = false;
    let pool = ALL.filter(d=>selectedCats.has(d.category));
    pool = shuffle(pool);
    if(selectedCount > 0) pool = pool.slice(0, selectedCount);
    startQuiz(pool);
  });

  function startQuiz(pool){
    queue = pool;
    idx = 0;
    rightN = 0; wrongN = 0;
    wrongItemsThisRound = [];
    screenSetup.classList.add('hidden');
    screenResult.classList.add('hidden');
    screenQuiz.classList.remove('hidden');
    showQuestion();
  }

  function showQuestion(){
    revealed = false;
    stopSpeaking();
    const item = queue[idx];
    document.getElementById('qTag').textContent = item.category;
    document.getElementById('qText').textContent = item.question;
    document.getElementById('aText').textContent = item.answer;
    document.getElementById('answerBlock').classList.add('hidden');
    document.getElementById('revealBtn').classList.remove('hidden');
    document.getElementById('judgeRow').classList.add('hidden');
    document.getElementById('progressNum').textContent = `${idx+1} / ${queue.length}`;
    document.getElementById('progressFill').style.width = `${(idx/queue.length)*100}%`;
    if(autoRead && ttsSupported){
      speak(item.question, speakQBtn);
    }
  }

  document.getElementById('revealBtn').addEventListener('click', ()=>{
    revealed = true;
    stopSpeaking();
    document.getElementById('answerBlock').classList.remove('hidden');
    document.getElementById('revealBtn').classList.add('hidden');
    document.getElementById('judgeRow').classList.remove('hidden');
    if(autoRead && ttsSupported){
      speak(document.getElementById('aText').textContent, speakABtn);
    }
  });

  function nextOrFinish(){
    if(idx < queue.length - 1){
      idx++;
      showQuestion();
    } else {
      finishQuiz();
    }
  }

  document.getElementById('rightBtn').addEventListener('click', ()=>{
    rightN++;
    if(usingWrongNoteMode){
      const wrongIds = loadWrongIds().filter(id=>id !== queue[idx]._id);
      saveWrongIds(wrongIds);
    }
    nextOrFinish();
  });

  document.getElementById('wrongBtn').addEventListener('click', ()=>{
    wrongN++;
    wrongItemsThisRound.push(queue[idx]);
    const wrongIds = loadWrongIds();
    wrongIds.push(queue[idx]._id);
    saveWrongIds(wrongIds);
    nextOrFinish();
  });

  document.getElementById('skipBtn').addEventListener('click', ()=>{
    nextOrFinish();
  });

  document.getElementById('quitBtn').addEventListener('click', ()=>{
    goSetup();
  });

  function goSetup(){
    stopSpeaking();
    screenQuiz.classList.add('hidden');
    screenResult.classList.add('hidden');
    screenSetup.classList.remove('hidden');
    renderCatGrid();
    updateStartState();
  }

  function finishQuiz(){
    stopSpeaking();
    document.getElementById('progressFill').style.width = `100%`;
    screenQuiz.classList.add('hidden');
    screenResult.classList.remove('hidden');

    const total = rightN + wrongN;
    const pct = total > 0 ? Math.round((rightN/total)*100) : 0;
    document.getElementById('resultScore').innerHTML = `${pct}<span>%</span>`;
    document.getElementById('rightCount').textContent = rightN;
    document.getElementById('wrongCount').textContent = wrongN;

    const reviewSection = document.getElementById('reviewSection');
    const reviewList = document.getElementById('reviewList');
    reviewList.innerHTML = '';
    if(wrongItemsThisRound.length > 0){
      reviewSection.classList.remove('hidden');
      wrongItemsThisRound.forEach(item=>{
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = `
          <div class="rtag">${item.category}</div>
          <div class="rq">${escapeHtml(item.question)}</div>
          <div class="ra">${escapeHtml(item.answer)}</div>
        `;
        reviewList.appendChild(div);
      });
    } else {
      reviewSection.classList.add('hidden');
    }

    const retryBtn = document.getElementById('retryWrongBtn');
    retryBtn.disabled = wrongItemsThisRound.length === 0;
    retryBtn.style.opacity = wrongItemsThisRound.length === 0 ? 0.4 : 1;
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('restartBtn').addEventListener('click', goSetup);

  document.getElementById('retryWrongBtn').addEventListener('click', ()=>{
    if(wrongItemsThisRound.length === 0) return;
    usingWrongNoteMode = true;
    startQuiz(shuffle(wrongItemsThisRound));
  });

  // init
  renderCatGrid();
  updateStartState();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
