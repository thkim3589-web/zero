<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기계기구 점검사진</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d5c45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: sticky progress header, one-column inspection cards, fixed save bar */
:root{
  --bg:#eef2ee; --surface:#ffffff; --fg:#16201b; --muted:#5b6b62; --line:#d6dfd8;
  --accent:#1d5c45; --accent-soft:#dcebe3; --on-accent:#ffffff;
  --warn:#b0500c; --warn-soft:#fbe9da;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#17201b; --fg:#e3ebe6; --muted:#93a39a; --line:#2a362f;
  --accent:#4dbb88; --accent-soft:#1c3a2d; --on-accent:#08130d;
  --warn:#f0a35a; --warn-soft:#3a2614; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#17201b; --fg:#e3ebe6; --muted:#93a39a; --line:#2a362f;
  --accent:#4dbb88; --accent-soft:#1c3a2d; --on-accent:#08130d;
  --warn:#f0a35a; --warn-soft:#3a2614; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 10px;display:grid;gap:8px}
header.top .wrap>*{min-width:0}
.brand h1{flex:none}
.brand .iconbtn{flex:none}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .file{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.prog b{font-family:var(--mono);color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

.controls{display:grid;gap:10px;padding-block:14px 6px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);letter-spacing:.02em}
.who{display:flex;gap:6px;margin:0}.who input{flex:1;min-width:0}.who .iconbtn{flex:none;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:42px}
.sheet{max-height:88vh;overflow:auto}
.mapbody{display:grid;gap:10px}
.pfs{border:0;margin:0;padding:0;min-width:0}.pfs legend{font-size:12px;color:var(--muted);padding:0;margin-bottom:4px}
.pcols{display:grid;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
.field .pcols input{width:20px;height:20px;min-height:0;flex:none;margin:0;padding:0;accent-color:var(--accent)}
.pcols label{display:flex;gap:8px;align-items:center;padding:6px 4px;font-size:14px;min-width:0}.pcols span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:42px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip small{font-family:var(--mono);opacity:.75;margin-left:4px}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.toggles label{display:flex;align-items:center;gap:6px}

.list{display:grid;gap:12px;padding-block:8px 20px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.item.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.item.bad{border-color:var(--warn)}
.item .hd{display:flex;align-items:center;gap:10px}
.no{font-family:var(--mono);font-size:13px;min-width:30px;height:30px;display:grid;place-items:center;border-radius:6px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.item.done .no{background:var(--accent);color:var(--on-accent)}
.nm{flex:1;min-width:0;display:grid}
.nm b{font-weight:600;overflow-wrap:anywhere}
.nm small{color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px}
.seg button[aria-pressed="true"][data-res="양호"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button[aria-pressed="true"][data-res="불량"]{background:var(--warn-soft);color:var(--warn);font-weight:600}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{position:relative;border:1.5px dashed var(--line);background:var(--bg);border-radius:10px;aspect-ratio:1/1;max-width:100%;padding:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px}
.slot.has{border-style:solid;border-color:transparent}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#1b211e}
.slot .lbl{z-index:1}
.slot .add{display:grid;justify-items:center;gap:2px}
.slot .add span:first-child{font-size:22px;line-height:1}
.slot .lbl{position:absolute;left:6px;top:6px;font-size:11px;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--fg)}
.note{width:100%;border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:9px 10px}
.empty-list{color:var(--muted);text-align:center;padding:40px 0}

.start{padding-block:32px;display:grid;gap:20px}
.start h2{margin:0;font-size:22px;text-wrap:balance}
.start p{margin:0;color:var(--muted);max-width:60ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--mono);width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent)}

.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--warn);color:var(--surface)}
.btn:disabled{opacity:.5}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{padding-block:10px;display:flex;gap:10px}
.savebar .btn.primary{flex:2}.savebar .btn.ghost{flex:1}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.sheet h3{margin:0;font-size:16px}
.sheet p{margin:0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.sheet .row{display:flex;gap:10px}
.sheet .row .btn{flex:1}
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:grid;grid-template-rows:1fr auto}
.viewer img{width:100%;height:100%;object-fit:contain;min-height:0}
.viewer .row{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer .row .btn{flex:1;background:#222;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:90vw}
.busy{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>기계기구 점검사진</h1>
      <span class="file" id="fileLabel"></span>
      <button class="iconbtn" id="menuBtn" hidden>메뉴</button>
    </div>
    <div class="prog" id="progRow" hidden>
      <span>완료</span><div class="bar"><i id="barFill"></i></div><b id="progText">0/0</b>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="start" id="start">
    <div style="display:grid;gap:8px">
      <h2>점검 엑셀을 불러와서 사진대지를 채워요</h2>
      <p>"사진대지" 시트의 품목마다 점검사진과 필증사진을 찍으면, 압축해서 엑셀 칸에 맞춰 넣어 저장해요.</p>
    </div>
    <ol class="steps">
      <li>점검 엑셀(.xlsx)을 불러옵니다. 양식이 다르면 사진 넣을 열을 한 번만 골라주면 돼요.</li>
      <li>사용자 이름을 입력하면 대상 품목만 나옵니다. 품목별로 공도구 점검사진과 필증사진을 찍고, 불량이면 처리내역을 적습니다.</li>
      <li>엑셀 저장을 누르면 "제목_월_작성자.xlsx"로 저장됩니다.</li>
    </ol>
    <div class="drop" id="drop">
      <button class="btn primary" id="pickBtn">엑셀 불러오기</button>
      <small style="color:var(--muted)">또는 파일을 여기로 끌어다 놓기</small>
    </div>
  </section>

  <section id="work" hidden>
    <div class="controls">
      <div class="fields">
        <div class="field"><label for="dateIn">점검일자</label><input type="date" id="dateIn"></div>
        <div class="field"><label for="authorIn">작성자</label><form class="who" id="whoForm"><input id="authorIn" placeholder="이름 입력" autocomplete="name" enterkeyhint="search"><button class="iconbtn" type="submit">조회</button></form></div>
      </div>
      <div class="field"><label for="q">공도구명으로 찾기</label><input type="search" id="q" placeholder="예: 드릴, 가스, ACBM" enterkeyhint="search" autocomplete="off"></div>
      <div class="toggles">
        <label><input type="checkbox" id="onlyTodo"> 미완료만 보기</label>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<div class="savebar" id="savebar" hidden>
  <div class="wrap"><button class="btn ghost" id="shareBtn">공유</button><button class="btn primary" id="saveBtn">엑셀 저장</button></div>
</div>

<input type="file" id="xlsxIn" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" hidden>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";
const NS_R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const NS_PR='http://schemas.openxmlformats.org/package/2006/relationships';
const NS_CT='http://schemas.openxmlformats.org/package/2006/content-types';
const MAX_PX=1024, JPG_Q=0.8;
const $=id=>document.getElementById(id);

/* ---------- storage ---------- */
let dbp;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{const r=indexedDB.open('inspect-photo',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('meta');d.createObjectStore('photos');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return dbp;}
async function idb(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(store,mode);const req=fn(tx.objectStore(store));let out;if(req)req.onsuccess=()=>{out=req.result};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
const dget=(s,k)=>idb(s,'readonly',o=>o.get(k)).catch(()=>undefined);
const dput=(s,k,v)=>idb(s,'readwrite',o=>o.put(v,k)).catch(e=>{console.warn(e);toast('저장 공간이 부족해요. 오래된 데이터를 지워주세요.');});
const ddel=(s,k)=>idb(s,'readwrite',o=>o.delete(k)).catch(()=>{});
const dclear=s=>idb(s,'readwrite',o=>o.clear()).catch(()=>{});
const dkeys=s=>idb(s,'readonly',o=>o.getAllKeys()).catch(()=>[]);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- xml helpers ---------- */
const parseXml=s=>new DOMParser().parseFromString(s,'application/xml');
const ser=d=>new XMLSerializer().serializeToString(d);
const byTag=(el,t)=>Array.from(el.getElementsByTagNameNS('*',t));
const colNum=c=>{let n=0;for(const ch of c)n=n*26+ch.charCodeAt(0)-64;return n};
const colName=n=>{let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
const splitRef=r=>{const m=/^\$?([A-Z]+)\$?(\d+)$/.exec(r);return m?{col:colNum(m[1]),row:+m[2]}:null};
const dirOf=p=>p.slice(0,p.lastIndexOf('/')+1);
const relsPathOf=p=>dirOf(p)+'_rels/'+p.slice(p.lastIndexOf('/')+1)+'.rels';
function resolvePath(base,t){if(t.startsWith('/'))return t.slice(1);const out=[];for(const p of (base+t).split('/')){if(p==='..')out.pop();else if(p!=='.'&&p!=='')out.push(p)}return out.join('/')}
async function readRels(zip,p){const f=zip.file(relsPathOf(p));if(!f)return[];const d=parseXml(await f.async('string'));return byTag(d,'Relationship').filter(r=>r.getAttribute('TargetMode')!=='External').map(r=>({id:r.getAttribute('Id'),type:r.getAttribute('Type')||'',path:resolvePath(dirOf(p),r.getAttribute('Target'))}))}
const norm=v=>String(v||'').replace(/\s/g,'');

async function readWorkbook(zip){
  const wb=parseXml(await zip.file('xl/workbook.xml').async('string'));
  const rels=await readRels(zip,'xl/workbook.xml');
  const sheets=byTag(wb,'sheet').map(s=>{const rid=s.getAttributeNS(NS_R,'id')||s.getAttribute('r:id');const rel=rels.find(r=>r.id===rid);return{name:s.getAttribute('name'),path:rel&&rel.path}}).filter(s=>s.path&&zip.file(s.path));
  let ss=[];const f=zip.file('xl/sharedStrings.xml');
  if(f){const d=parseXml(await f.async('string'));ss=byTag(d,'si').map(si=>byTag(si,'t').map(t=>t.textContent).join(''))}
  return{sheets,ss};
}
async function readSheet(zip,path,ss){
  const doc=parseXml(await zip.file(path).async('string'));const rows=new Map();
  for(const c of byTag(doc,'c')){const rf=splitRef(c.getAttribute('r')||'');if(!rf)continue;const t=c.getAttribute('t');let v='';const ve=byTag(c,'v')[0];
    if(t==='s')v=ve?(ss[+ve.textContent]||''):'';else if(t==='inlineStr')v=byTag(c,'t').map(x=>x.textContent).join('');else v=ve?ve.textContent:'';
    if(!rows.has(rf.row))rows.set(rf.row,new Map());rows.get(rf.row).set(rf.col,String(v).trim())}
  return{doc,rows};
}
const sortedRows=rows=>[...rows].sort((a,b)=>a[0]-b[0]);
function findHeader(rows,needles){for(const[r,cells]of sortedRows(rows)){const vals=[...cells.values()].map(norm);if(needles.every(n=>vals.some(v=>v.includes(n))))return r}return null}
function colOf(cells,pred){for(const[c,v]of cells)if(pred(norm(v)))return c;return null}
function colWidths(doc){const cols=byTag(doc,'col').map(c=>({min:+c.getAttribute('min'),max:+c.getAttribute('max'),w:+c.getAttribute('width')}));const f=byTag(doc,'sheetFormatPr')[0];const def=f&&f.getAttribute('defaultColWidth')?+f.getAttribute('defaultColWidth'):8.43;return c=>{const e=cols.find(x=>c>=x.min&&c<=x.max);return e&&e.w?e.w:def}}
function rowHeights(doc){const m={};for(const r of byTag(doc,'row')){const h=r.getAttribute('ht');if(h)m[+r.getAttribute('r')]=+h}const f=byTag(doc,'sheetFormatPr')[0];const def=f&&f.getAttribute('defaultRowHeight')?+f.getAttribute('defaultRowHeight'):15;return r=>m[r]||def}
const colPx=(w,mdw)=>Math.floor((w*256+Math.floor(128/mdw))/256*mdw);
async function digitWidth(zip){const f=zip.file('xl/styles.xml');if(!f)return 7;const s=await f.async('string');const m=/<font>[\s\S]*?<name val="([^"]+)"/.exec(s);return m&&/맑은|Malgun|굴림|돋움|Gulim|Dotum|나눔|Nanum/.test(m[1])?8:7}

/* ---------- images ---------- */
async function toBitmap(blob){try{return await createImageBitmap(blob,{imageOrientation:'from-image'})}catch(e){return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(blob)})}}
async function compress(blob,stamp){
  const bmp=await toBitmap(blob);const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;
  const sc=Math.min(1,MAX_PX/Math.max(w0,h0));const c=document.createElement('canvas');c.width=Math.round(w0*sc);c.height=Math.round(h0*sc);
  const g=c.getContext('2d');g.drawImage(bmp,0,0,c.width,c.height);if(bmp.close)bmp.close();
  if(stamp){const fs=Math.max(14,Math.round(c.width*0.034));g.font=`600 ${fs}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`;const pad=Math.round(fs*0.45);const tw=g.measureText(stamp).width;
    g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,c.height-fs-pad*2,Math.min(c.width,tw+pad*2),fs+pad*2);g.fillStyle='#fff';g.textBaseline='middle';g.fillText(stamp,pad,c.height-pad-fs/2)}
  return await new Promise(r=>c.toBlob(r,'image/jpeg',JPG_Q));
}
async function imgSize(blob){const b=await toBitmap(blob);const s={w:b.width||b.naturalWidth,h:b.height||b.naturalHeight};if(b.close)b.close();return s}

/* ---------- state ---------- */
let P=null, BUF=null; const have=new Set(); const urls=new Map();
let author=ls.get('ip.author',''), onlyTodo=ls.get('ip.todo','0')==='1';
const users=()=>P&&P.hasUser?[...new Set(P.items.map(i=>i.user).filter(Boolean))]:[];
const mine=()=>P.hasUser?P.items.filter(i=>i.user===author):P.items;
const key=(id,s)=>id+'_'+s;
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const isDone=it=>P.photo.cols.every((_,s)=>have.has(key(it.id,s)));
const RES=()=>P.resLabels||['양호','불량'];
const saveMeta=()=>dput('meta','project',P);

/* ---------- form detection ---------- */
const NAME_KEYS=['품목명','공도구명','공구명','장비명','기계기구명','기구명','자재명','품명','명칭','품목','장비','공도구'];
const USER_KEYS=['사용자','관리자','담당자','관리감독자','성명','이름','작성자'];
const NO_KEYS=['구분','번호','순번','연번','No','NO','no','No.'];
const PHOTO_RE=/사진|필증|photo/i;
function findCol(cells,keys,excl){excl=excl||[];
  for(const k of keys)for(const[c,v]of cells)if(!excl.includes(c)&&norm(v)===k)return c;
  for(const k of keys)for(const[c,v]of cells)if(!excl.includes(c)&&norm(v).includes(k))return c;return null}
const findExact=(cells,keys)=>{for(const[c,v]of cells)if(keys.includes(norm(v)))return c;return null};
const photoColsOf=cells=>[...cells].filter(([c,v])=>PHOTO_RE.test(v)&&norm(v).length<=40).map(([c])=>c).sort((a,b)=>a-b);
function firstHeaderRow(rows){const sr=sortedRows(rows).filter(([r])=>r<=40);const h=sr.find(([r,c])=>[...c.values()].filter(Boolean).length>=3)||sr.find(([r,c])=>[...c.values()].some(Boolean));return h?h[0]:1}
function guessCols(s,r){const cells=s.rows.get(r)||new Map();const photo=photoColsOf(cells);
  let cName=findCol(cells,NAME_KEYS,photo);if(!cName){const t=[...cells].filter(([c,v])=>v&&!photo.includes(c)&&!/^\d+$/.test(v)).map(([c])=>c).sort((a,b)=>a-b);cName=t.find(c=>!keysHit(cells.get(c),NO_KEYS))||t[0]||1}
  return{cName,cUser:findCol(cells,USER_KEYS,[...photo,cName]),cNo:findExact(cells,NO_KEYS),photoCols:photo}}
const keysHit=(v,keys)=>keys.includes(norm(v));
function detect(an){const order=[...an.sheets].sort((a,b)=>(/사진/.test(b.name)?1:0)-(/사진/.test(a.name)?1:0));
  for(const s of order)for(const[r,cells]of sortedRows(s.rows)){if(r>40)break;
    const photo=photoColsOf(cells);if(!photo.length)continue;const cName=findCol(cells,NAME_KEYS,photo);if(!cName)continue;
    return{sheet:s.name,headerRow:r,cName,cUser:findCol(cells,USER_KEYS,[...photo,cName]),cNo:findExact(cells,NO_KEYS),photoCols:photo}}
  return null}
function guessInitial(an){const s=an.sheets.find(x=>/사진/.test(x.name))||an.sheets[0];const r=firstHeaderRow(s.rows);return{sheet:s.name,headerRow:r,...guessCols(s,r)}}
function signature(an){return an.sheets.map(s=>{const r=firstHeaderRow(s.rows);const c=s.rows.get(r)||new Map();return s.name+':'+[...c].sort((a,b)=>a[0]-b[0]).map(([k,v])=>k+'='+norm(v)).join(',')}).join('|')}
const validMap=(an,m)=>!!(m&&m.photoCols&&m.photoCols.length&&m.cName&&an.sheets.some(s=>s.name===m.sheet));
function loadForms(){try{return JSON.parse(ls.get('ip.forms','{}'))||{}}catch(e){return{}}}

async function analyze(buf){const zip=await JSZip.loadAsync(buf);const{sheets,ss}=await readWorkbook(zip);
  if(!sheets.length)throw new Error('엑셀에서 시트를 찾지 못했어요.');
  for(const s of sheets){const r=await readSheet(zip,s.path,ss);s.rows=r.rows;s.doc=r.doc}
  return{zip,sheets,ss}}

async function buildProject(an,m,fileName){
  const s=an.sheets.find(x=>x.name===m.sheet);if(!s)throw new Error(`"${m.sheet}" 시트를 찾지 못했어요.`);
  const h=s.rows.get(m.headerRow)||new Map();
  const labels=m.photoCols.map(c=>((h.get(c)||'').split('(')[0].trim())||colName(c)+'열 사진');
  const items=[];
  for(const[r,cells]of sortedRows(s.rows)){if(r<=m.headerRow)continue;const nm=cells.get(m.cName);if(!nm)continue;
    items.push({ref:m.cNo?(cells.get(m.cNo)||''):'',name:nm,user:m.cUser?(cells.get(m.cUser)||''):'',row:r})}
  if(!items.length)throw new Error(`"${s.name}" 시트의 ${colName(m.cName)}열(품목명)에 품목이 없어요.`);
  const cnt={};items.forEach(i=>{if(i.ref)cnt[i.ref]=(cnt[i.ref]||0)+1});
  items.forEach((i,n)=>{i.id=i.ref&&cnt[i.ref]===1?i.ref:'r'+i.row;i.no=i.ref||String(n+1)});
  /* 점검결과 칸 찾기: 같은 시트 → 다른 시트 */
  let check=null,resLabels=['양호','불량'];const status={};
  for(const cs of[s,...an.sheets.filter(x=>x!==s)]){
    let hr=null,ch=null;
    if(cs===s){hr=m.headerRow;ch=h}else for(const[r,cells]of sortedRows(cs.rows)){if(r>40)break;if(findCol(cells,['점검여부','점검결과','판정'])&&findCol(cells,NAME_KEYS)){hr=r;ch=cells;break}}
    if(!ch)continue;const ex=cs===s?[...m.photoCols,m.cName]:[];
    const cRes=findCol(ch,['점검여부','점검결과','판정결과','판정','양호','적합'],ex);
    const cNote=findCol(ch,['처리내역','조치내역','조치사항','조치결과','처리'],ex);
    const cDate=findCol(ch,['점검일자','점검일','점검날짜','일자','날짜'],ex);
    if(!cRes&&!cDate)continue;
    const rowOf={};
    if(cs===s)items.forEach(i=>rowOf[i.id]=i.row);
    else{const cNo2=findExact(ch,NO_KEYS),cName2=findCol(ch,NAME_KEYS),cUser2=findCol(ch,USER_KEYS,[cName2]);
      const byNo={},byNU={},nu=c=>norm(c.get(cName2))+'|'+(cUser2?norm(c.get(cUser2)):'');
      for(const[r,c]of cs.rows){if(r<=hr||!c.get(cName2))continue;if(cNo2&&c.get(cNo2))byNo[c.get(cNo2)]=r;const k=nu(c);byNU[k]=byNU[k]===undefined?r:-1}
      for(const i of items){const k=norm(i.name)+'|'+(cUser2?norm(i.user):'');
        if(i.ref&&cNo2&&byNo[i.ref])rowOf[i.id]=byNo[i.ref];else if(byNU[k]>0)rowOf[i.id]=byNU[k]}}
    if(!Object.keys(rowOf).length)continue;
    const colVals=c=>c?[...cs.rows].filter(([r])=>r>hr).map(([r,x])=>x.get(c)).filter(Boolean):[];
    if(colVals(cRes).some(v=>/적합/.test(v)))resLabels=['적합','부적합'];
    const dateAsText=colVals(cDate).some(v=>!/^\d+(\.\d+)?$/.test(v));
    for(const i of items){const r=rowOf[i.id],c=r&&cs.rows.get(r);status[i.id]={result:c&&cRes&&c.get(cRes)===resLabels[1]?'불량':'양호',note:(c&&cNote&&c.get(cNote))||''}}
    check={path:cs.path,name:cs.name,cRes,cNote,cDate,rowOf,dateAsText};break}
  for(const i of items)if(!status[i.id])status[i.id]={result:'양호',note:''};
  const existing=await readExistingPhotos(an.zip,s.path,s.doc,items,m.photoCols);
  const title=fileName.replace(/\.xlsx$/i,'').replace(/[_\s-]*\d{1,2}월$/,'').trim();
  return{project:{fileName,title,photo:{path:s.path,sheet:s.name,cols:m.photoCols,labels},check,items,status,date:today(),hasUser:!!m.cUser&&items.some(i=>i.user),resLabels,map:m},existing};
}

/* 그림 위치 → (품목, 사진칸) */
async function anchorLocator(zip,sdoc,items,cols){
  const cw=colWidths(sdoc),rh=rowHeights(sdoc),dw=await digitWidth(zip);
  const W=c=>colPx(cw(c),dw),H=r=>rh(r)*96/72;const xs=[0],ys=[0];
  const X=c=>{while(xs.length<c)xs.push(xs[xs.length-1]+W(xs.length));return xs[c-1]};
  const Y=r=>{while(ys.length<r)ys.push(ys[ys.length-1]+H(ys.length));return ys[r-1]};
  const tx=(el,t)=>{const e=byTag(el,t)[0];return e?+e.textContent||0:0};
  return a=>{const f=byTag(a,'from')[0];if(!f)return null;
    const x1=X(tx(f,'col')+1)+tx(f,'colOff')/9525,y1=Y(tx(f,'row')+1)+tx(f,'rowOff')/9525;let x2=x1,y2=y1;
    const t=byTag(a,'to')[0],ext=Array.from(a.children).find(e=>e.localName==='ext');
    if(t){x2=X(tx(t,'col')+1)+tx(t,'colOff')/9525;y2=Y(tx(t,'row')+1)+tx(t,'rowOff')/9525}
    else if(ext){x2=x1+(+ext.getAttribute('cx')||0)/9525;y2=y1+(+ext.getAttribute('cy')||0)/9525}
    const cx=(x1+x2)/2,cy=(y1+y2)/2;
    const it=items.find(i=>cy>=Y(i.row)&&cy<Y(i.row)+H(i.row));if(!it)return null;
    const slot=cols.findIndex(c=>cx>=X(c)&&cx<X(c)+W(c));return slot<0?null:{it,slot}}}
async function readExistingPhotos(zip,sheetPath,sdoc,items,cols){
  const out=[];const rels=await readRels(zip,sheetPath);const dr=rels.find(r=>/\/drawing$/.test(r.type));if(!dr||!zip.file(dr.path))return out;
  const d=parseXml(await zip.file(dr.path).async('string'));const drels=await readRels(zip,dr.path);const loc=await anchorLocator(zip,sdoc,items,cols);
  for(const a of Array.from(d.documentElement.children)){if(!/Anchor$/.test(a.localName))continue;
    const hit=loc(a);if(!hit)continue;const k=key(hit.it.id,hit.slot);if(out.some(o=>o.k===k))continue;
    const blip=byTag(a,'blip')[0];if(!blip)continue;const rid=blip.getAttributeNS(NS_R,'embed')||blip.getAttribute('r:embed');const rel=drels.find(r=>r.id===rid);
    if(!rel||!zip.file(rel.path))continue;out.push({k,ab:await zip.file(rel.path).async('arraybuffer')})}
  return out;
}

/* ---------- build xlsx ---------- */
function setCell(doc,sd,rowNum,col,val){
  const NS=doc.documentElement.namespaceURI;
  let row=Array.from(sd.children).find(r=>+r.getAttribute('r')===rowNum);
  if(!row){row=doc.createElementNS(NS,'row');row.setAttribute('r',rowNum);sd.insertBefore(row,Array.from(sd.children).find(r=>+r.getAttribute('r')>rowNum)||null)}
  const ref=colName(col)+rowNum;let c=Array.from(row.children).find(x=>x.getAttribute('r')===ref);
  if(!c){if(val===''||val==null)return;c=doc.createElementNS(NS,'c');c.setAttribute('r',ref);
    const prev=Array.from(sd.children).find(r=>+r.getAttribute('r')===rowNum-1);const pc=prev&&Array.from(prev.children).find(x=>x.getAttribute('r')===colName(col)+(rowNum-1));if(pc&&pc.getAttribute('s'))c.setAttribute('s',pc.getAttribute('s'));
    row.insertBefore(c,Array.from(row.children).find(x=>{const r=splitRef(x.getAttribute('r')||'');return r&&r.col>col})||null)}
  while(c.firstChild)c.removeChild(c.firstChild);c.removeAttribute('t');
  if(val===''||val==null)return;
  if(typeof val==='number'){const v=doc.createElementNS(NS,'v');v.textContent=String(val);c.appendChild(v)}
  else{c.setAttribute('t','inlineStr');const is=doc.createElementNS(NS,'is'),t=doc.createElementNS(NS,'t');t.textContent=val;is.appendChild(t);c.appendChild(is)}
}
const dateSerial=s=>{const[y,m,d]=s.split('-').map(Number);return(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5};

async function buildXlsx(){
  const zip=await JSZip.loadAsync(BUF);const sp=P.photo.path;
  const sdoc=parseXml(await zip.file(sp).async('string'));const cw=colWidths(sdoc),rh=rowHeights(sdoc),dw=await digitWidth(zip);
  const ct=parseXml(await zip.file('[Content_Types].xml').async('string'));
  const srp=relsPathOf(sp);const sRels=parseXml(zip.file(srp)?await zip.file(srp).async('string'):EMPTY_RELS);
  const dRel=byTag(sRels,'Relationship').find(r=>/\/drawing$/.test(r.getAttribute('Type')||''));
  let drawPath,ddoc,drels;
  if(dRel&&zip.file(resolvePath(dirOf(sp),dRel.getAttribute('Target')))){drawPath=resolvePath(dirOf(sp),dRel.getAttribute('Target'));
    ddoc=parseXml(await zip.file(drawPath).async('string'));const rp=relsPathOf(drawPath);drels=parseXml(zip.file(rp)?await zip.file(rp).async('string'):EMPTY_RELS)}
  else{let n=1;while(zip.file(`xl/drawings/drawing${n}.xml`))n++;drawPath=`xl/drawings/drawing${n}.xml`;
    const ids=byTag(sRels,'Relationship').map(r=>r.getAttribute('Id'));let k=1;while(ids.includes('rId'+k))k++;
    const rel=sRels.createElementNS(NS_PR,'Relationship');rel.setAttribute('Id','rId'+k);rel.setAttribute('Type',NS_R+'/drawing');rel.setAttribute('Target',`../drawings/drawing${n}.xml`);sRels.documentElement.appendChild(rel);zip.file(srp,ser(sRels));
    const el=sdoc.createElementNS(sdoc.documentElement.namespaceURI,'drawing');el.setAttributeNS(NS_R,'r:id','rId'+k);
    const after=['legacyDrawing','legacyDrawingHF','drawingHF','picture','oleObjects','controls','webPublishItems','tableParts','extLst'];
    sdoc.documentElement.insertBefore(el,Array.from(sdoc.documentElement.children).find(ch=>after.includes(ch.localName))||null);zip.file(sp,ser(sdoc));
    const o=ct.createElementNS(NS_CT,'Override');o.setAttribute('PartName','/'+drawPath);o.setAttribute('ContentType','application/vnd.openxmlformats-officedocument.drawing+xml');ct.documentElement.appendChild(o);
    ddoc=parseXml(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="${NS_XDR}" xmlns:a="${NS_A}" xmlns:r="${NS_R}"/>`);drels=parseXml(EMPTY_RELS)}
  if(!byTag(ct,'Default').some(d=>(d.getAttribute('Extension')||'').toLowerCase()==='jpeg')){const e=ct.createElementNS(NS_CT,'Default');e.setAttribute('Extension','jpeg');e.setAttribute('ContentType','image/jpeg');ct.documentElement.insertBefore(e,ct.documentElement.firstChild)}
  /* 사진칸에 있던 기존 그림만 빼고, 로고·도형 등은 그대로 둠 */
  const loc=await anchorLocator(zip,sdoc,P.items,P.photo.cols);const removed=new Set();
  for(const a of Array.from(ddoc.documentElement.children)){if(!/Anchor$/.test(a.localName)||!loc(a))continue;
    for(const el of[a,...a.getElementsByTagName('*')])for(const at of Array.from(el.attributes))if(at.namespaceURI===NS_R)removed.add(at.value);
    a.parentNode.removeChild(a)}
  const used=new Set();for(const el of Array.from(ddoc.getElementsByTagName('*')))for(const at of Array.from(el.attributes))if(at.namespaceURI===NS_R)used.add(at.value);
  const dropped=[];
  for(const r of byTag(drels,'Relationship')){const id=r.getAttribute('Id');if(removed.has(id)&&!used.has(id)){if(r.getAttribute('TargetMode')!=='External')dropped.push(resolvePath(dirOf(drawPath),r.getAttribute('Target')));r.parentNode.removeChild(r)}}
  const rids=new Set(byTag(drels,'Relationship').map(r=>r.getAttribute('Id')));let rn=1;const nextRid=()=>{while(rids.has('rId'+rn))rn++;rids.add('rId'+rn);return'rId'+rn};
  let pid=Math.max(1,...byTag(ddoc,'cNvPr').map(e=>+e.getAttribute('id')||0))+1;
  const anchors=[];let n=0;
  for(const it of mine())for(let s=0;s<P.photo.cols.length;s++){
    const blob=await dget('photos',key(it.id,s));if(!blob)continue;const{w,h}=await imgSize(blob);
    const rid=nextRid(),media=`insp_${Date.now().toString(36)}_${++n}.jpeg`;zip.file('xl/media/'+media,await blob.arrayBuffer());
    const rel=drels.createElementNS(NS_PR,'Relationship');rel.setAttribute('Id',rid);rel.setAttribute('Type',NS_R+'/image');rel.setAttribute('Target','../media/'+media);drels.documentElement.appendChild(rel);
    const col=P.photo.cols[s];const W=colPx(cw(col),dw),H=Math.floor(rh(it.row)*96/72),pad=1;
    const sc=Math.min((W-pad*2)/w,(H-pad*2)/h),iw=w*sc,ih=h*sc;
    const E=v=>Math.max(0,Math.round(v*9525)),cx=E(iw),cy=E(ih),ox=E((W-iw)/2),oy=E((H-ih)/2);const id=pid++;
    anchors.push(`<xdr:oneCellAnchor><xdr:from><xdr:col>${col-1}</xdr:col><xdr:colOff>${ox}</xdr:colOff><xdr:row>${it.row-1}</xdr:row><xdr:rowOff>${oy}</xdr:rowOff></xdr:from><xdr:ext cx="${cx}" cy="${cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${id}" name="Picture ${id}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`);
  }
  const frag=parseXml(`<r xmlns:xdr="${NS_XDR}" xmlns:a="${NS_A}" xmlns:r="${NS_R}">${anchors.join('')}</r>`);
  for(const a of Array.from(frag.documentElement.children))ddoc.documentElement.appendChild(ddoc.importNode(a,true));
  zip.file(drawPath,ser(ddoc));zip.file(relsPathOf(drawPath),ser(drels));
  if(dropped.length){const relTexts=await Promise.all(zip.file(/\.rels$/).map(f=>f.async('string')));
    for(const d of dropped){const base=d.slice(d.lastIndexOf('/')+1);if(!relTexts.some(t=>t.includes(base))&&zip.file(d))zip.remove(d)}}
  if(P.check&&zip.file(P.check.path)){const C=P.check;const cd=parseXml(await zip.file(C.path).async('string'));const sd=byTag(cd,'sheetData')[0];const L=RES();
    for(const it of mine()){const r=C.rowOf&&C.rowOf[it.id];if(!r)continue;const st=P.status[it.id];
      if(C.cRes)setCell(cd,sd,r,C.cRes,st.result==='불량'?L[1]:L[0]);if(C.cNote)setCell(cd,sd,r,C.cNote,st.result==='불량'?st.note.trim():'');
      if(C.cDate&&P.date)setCell(cd,sd,r,C.cDate,C.dateAsText?P.date.replace(/-/g,'.'):dateSerial(P.date))}
    zip.file(C.path,ser(cd))}
  if(zip.file('xl/calcChain.xml')){zip.remove('xl/calcChain.xml');for(const o of byTag(ct,'Override'))if(/calcChain/.test(o.getAttribute('PartName')))o.parentNode.removeChild(o);
    const wr=parseXml(await zip.file('xl/_rels/workbook.xml.rels').async('string'));for(const r of byTag(wr,'Relationship'))if(/calcChain/.test(r.getAttribute('Target')))r.parentNode.removeChild(r);zip.file('xl/_rels/workbook.xml.rels',ser(wr))}
  zip.file('[Content_Types].xml',ser(ct));
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',compression:'DEFLATE'});
}

function pickAuthor(){const hu=P.hasUser;
  sheet(`<h3>${hu?'사용자 이름을 입력하세요':'작성자 이름을 입력하세요'}</h3><p>${hu?'입력한 이름의 대상 품목만 불러와서 사진을 정리해요.':'이 엑셀에는 사용자 열이 없어서 전체 품목을 보여줘요. 이름은 저장 파일명에 들어가요.'}</p>
    <form class="who" id="whoSheet"><input id="whoName" placeholder="예: 김태호" autocomplete="name" enterkeyhint="done" style="border:1px solid var(--line);border-radius:8px;padding:10px;min-height:46px;background:var(--surface)"><button class="btn primary" type="submit">${hu?'조회':'확인'}</button></form>
    <p id="whoErr" style="color:var(--warn)" hidden></p>`,
    (el,c)=>{const inp=el.querySelector('#whoName');inp.value=author||'';setTimeout(()=>inp.focus(),50);
      el.querySelector('#whoSheet').addEventListener('submit',e=>{e.preventDefault();const u=matchUser(inp.value);
        if(u){c();setAuthor(u)}else{const er=el.querySelector('#whoErr');er.hidden=false;er.textContent=inp.value.trim()?`"${inp.value.trim()}" 이름의 대상 품목이 없어요. 엑셀의 사용자 이름과 같게 입력해주세요.`:'이름을 입력해주세요.'}})})}
function setAuthor(u){author=u;ls.set('ip.author',u);renderAll()}
function renderProgress(){const its=mine(),d=its.filter(isDone).length,n=its.length;$('progText').textContent=`${d}/${n}`;$('barFill').style.width=(n?d/n*100:0)+'%'}
let query='';
function visibleItems(){const q=norm(query).toLowerCase();return mine().filter(i=>(!onlyTodo||!isDone(i))&&(!q||norm(i.name).toLowerCase().includes(q)))}
function cardHtml(it){const st=P.status[it.id];const bad=st.result==='불량';const L=RES(),C=P.check,N=P.photo.cols.length;
  return`<article class="item${isDone(it)?' done':''}${bad&&C?' bad':''}" data-id="${esc(it.id)}">
  <div class="hd"><span class="no">${esc(it.no)}</span><div class="nm"><b>${esc(it.name)}</b>${it.user?`<small>${esc(it.user)}</small>`:''}</div>
  ${C&&C.cRes?`<div class="seg" role="group" aria-label="점검결과"><button data-res="양호" aria-pressed="${!bad}">${esc(L[0])}</button><button data-res="불량" aria-pressed="${bad}">${esc(L[1])}</button></div>`:''}</div>
  <div class="slots" style="grid-template-columns:repeat(${N===1?1:N===3?3:2},1fr)">${P.photo.cols.map((_,s)=>`<button class="slot" data-slot="${s}" aria-label="${esc(P.photo.labels[s])}"></button>`).join('')}</div>
  ${C&&C.cNote?`<input class="note" id="note-${esc(it.id)}" placeholder="${esc(L[1])} 처리내역 (예: 배터리 교체 후 재점검)" value="${esc(st.note)}" ${bad?'':'hidden'}>`:''}
  </article>`}
async function fillSlots(card,it){for(let s=0;s<P.photo.cols.length;s++){const b=card.querySelector(`.slot[data-slot="${s}"]`);const k=key(it.id,s);
  if(have.has(k)){const u=await urlFor(k);b.classList.add('has');b.innerHTML=`<img src="${u}" alt=""><span class="lbl">${esc(P.photo.labels[s])}</span>`}
  else{b.classList.remove('has');b.innerHTML=`<span class="add"><span>+</span><span>${esc(P.photo.labels[s])}</span></span>`}}}
const cardOf=it=>$('list').querySelector(`[data-id="${CSS.escape(it.id)}"]`);
function renderList(){const its=visibleItems();const L=$('list');
  if(!its.length){L.innerHTML=`<div class="empty-list">${query.trim()&&author?`"${esc(query.trim())}" 공도구가 없어요.`:!author?'사용자 이름을 입력하면 대상 품목이 나와요.':onlyTodo?'모든 품목의 사진을 찍었어요.':'품목이 없어요.'}</div>`;return}
  L.innerHTML=its.map(cardHtml).join('');for(const it of its)fillSlots(cardOf(it),it)}
function refreshCard(it){const c=cardOf(it);if(!c)return;c.classList.toggle('done',isDone(it));fillSlots(c,it);renderProgress()}
const itemById=id=>P.items.find(i=>i.id===id);

/* ---------- actions ---------- */
let pending=null;
function openSlot(it,s){const k=key(it.id,s),has=have.has(k);
  sheet(`<h3>${esc(it.no)}. ${esc(it.name)} · ${esc(P.photo.labels[s])}</h3><p>${esc(it.user)}</p>
   <div class="row"><button class="btn primary" data-a="cam">카메라 촬영</button><button class="btn ghost" data-a="gal">앨범에서 선택</button></div>
   ${has?'<div class="row"><button class="btn ghost" data-a="view">크게 보기</button><button class="btn ghost" data-a="del">사진 삭제</button></div>':''}
   <button class="btn ghost" data-a="x">닫기</button>`,(el,close)=>el.addEventListener('click',async e=>{const a=e.target.dataset.a;if(!a)return;close();
     if(a==='cam'||a==='gal'){pending={it,s};const inp=$(a==='cam'?'camIn':'galIn');inp.value='';inp.click()}
     else if(a==='view')viewPhoto(it,s);
     else if(a==='del'){await ddel('photos',k);have.delete(k);dropUrl(k);refreshCard(it);toast('사진을 삭제했어요')}}));}
async function onPhoto(e){const f=e.target.files&&e.target.files[0];if(!f||!pending)return;const{it,s}=pending;pending=null;
  const done=busy('사진 압축 중…');
  try{const stamp='';
    const blob=await compress(f,stamp);const k=key(it.id,s);await dput('photos',k,blob);have.add(k);dropUrl(k);refreshCard(it)}
  catch(err){console.error(err);toast('사진을 읽지 못했어요. 다른 사진으로 다시 시도해주세요.')}finally{done()}}
async function viewPhoto(it,s){const u=await urlFor(key(it.id,s));if(!u)return;const v=document.createElement('div');v.className='viewer';
  v.innerHTML=`<img src="${u}" alt="${esc(it.name)}"><div class="row"><button class="btn" data-a="re">다시 찍기</button><button class="btn" data-a="x">닫기</button></div>`;
  v.addEventListener('click',e=>{const a=e.target.dataset.a;if(a==='x'){v.remove()}else if(a==='re'){v.remove();pending={it,s};$('camIn').value='';$('camIn').click()}});$('layer').appendChild(v)}

function mapDialog(an,init){return new Promise(res=>{let m={...init,photoCols:[...(init.photoCols||[])]},done=false;
  const fin=v=>{if(done)return;done=true;res(v)};
  const bg=sheet(`<h3>양식 설정</h3><p>사진을 넣을 표를 알려주세요. 한 번 설정하면 같은 양식은 다음부터 자동으로 인식해요.</p><div id="mapBody" class="mapbody"></div><p id="mapSum" style="font-weight:600;color:var(--fg)"></p><div class="row"><button class="btn ghost" data-a="cancel">취소</button><button class="btn primary" data-a="ok" id="mapOk">이 양식으로 시작</button></div>`,
    (el,c)=>{const body=el.querySelector('#mapBody');
      const sh=()=>an.sheets.find(x=>x.name===m.sheet)||an.sheets[0];
      const opt=(v,t,cur)=>`<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(t)}</option>`;
      const draw=()=>{const s=sh(),h=s.rows.get(+m.headerRow)||new Map();let maxC=1;for(const[,c]of s.rows)for(const k of c.keys())if(k>maxC)maxC=k;maxC=Math.min(maxC,40);
        const sample=c=>{for(const[r,x]of sortedRows(s.rows))if(r>m.headerRow&&x.get(c))return x.get(c);return''};
        const cols=[];for(let c=1;c<=maxC;c++){const t=h.get(c)||'',sm=sample(c);cols.push({v:c,t:`${colName(c)}열 · ${t||'(머리글 없음)'}${sm?' · 예: '+sm:''}`.slice(0,60)})}
        const rows=sortedRows(s.rows).filter(([r])=>r<=40).map(([r,x])=>({v:r,t:`${r}행 · ${[...x].sort((a,b)=>a[0]-b[0]).map(([,v])=>v).filter(Boolean).slice(0,4).join(' / ')}`.slice(0,60)}));
        body.innerHTML=`<div class="field"><label for="mSheet">시트</label><select id="mSheet">${an.sheets.map(x=>opt(x.name,x.name,m.sheet)).join('')}</select></div>
          <div class="field"><label for="mRow">머리글(제목) 행</label><select id="mRow">${rows.map(o=>opt(o.v,o.t,m.headerRow)).join('')}</select></div>
          <div class="field"><label for="mName">품목명(공도구명) 열</label><select id="mName">${cols.map(o=>opt(o.v,o.t,m.cName)).join('')}</select></div>
          <div class="field"><label for="mUser">사용자 열</label><select id="mUser">${opt('','없음 (전체 품목 표시)',m.cUser||'')}${cols.map(o=>opt(o.v,o.t,m.cUser)).join('')}</select></div>
          <div class="field"><label for="mNo">번호 열</label><select id="mNo">${opt('','없음',m.cNo||'')}${cols.map(o=>opt(o.v,o.t,m.cNo)).join('')}</select></div>
          <fieldset class="field pfs"><legend>사진 넣을 열 (여러 개 선택 가능)</legend><div class="pcols">${cols.map(o=>`<label><input type="checkbox" value="${o.v}"${m.photoCols.includes(o.v)?' checked':''}><span>${esc(o.t)}</span></label>`).join('')}</div></fieldset>`;
        sum()};
      const sum=()=>{const s=sh();let n=0;const us=new Set();for(const[r,x]of s.rows)if(r>m.headerRow&&x.get(+m.cName)){n++;if(m.cUser&&x.get(+m.cUser))us.add(x.get(+m.cUser))}
        const okv=n>0&&m.photoCols.length>0;el.querySelector('#mapSum').textContent=!m.photoCols.length?'사진 넣을 열을 하나 이상 골라주세요.':!n?'품목명 열에 품목이 없어요. 머리글 행과 품목명 열을 확인해주세요.':`품목 ${n}건${m.cUser?` · 사용자 ${us.size}명`:''} · 사진 ${m.photoCols.length}칸`;
        el.querySelector('#mapOk').disabled=!okv};
      body.addEventListener('change',e=>{const t=e.target;
        if(t.id==='mSheet'){m.sheet=t.value;const s=sh();m.headerRow=firstHeaderRow(s.rows);Object.assign(m,guessCols(s,m.headerRow));draw();return}
        if(t.id==='mRow'){m.headerRow=+t.value;Object.assign(m,guessCols(sh(),m.headerRow));draw();return}
        if(t.id==='mName')m.cName=+t.value;else if(t.id==='mUser')m.cUser=t.value?+t.value:null;else if(t.id==='mNo')m.cNo=t.value?+t.value:null;
        else if(t.type==='checkbox'){m.photoCols=[...body.querySelectorAll('.pcols input:checked')].map(x=>+x.value).sort((a,b)=>a-b)}
        sum()});
      el.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;if(a==='ok'){m.headerRow=+m.headerRow;m.cName=+m.cName;c();fin(m)}else if(a==='cancel'){c();fin(null)}});
      draw()});
  bg.addEventListener('click',e=>{if(e.target===bg)fin(null)});
  new MutationObserver((_,o)=>{if(!bg.isConnected){o.disconnect();fin(null)}}).observe($('layer'),{childList:true});
})}

async function openWorkbook(buf,fileName,forceMap){
  let done=busy('엑셀 읽는 중…');
  try{const an=await analyze(buf);const sig=signature(an);const forms=loadForms();
    let m=null,how='';
    if(!forceMap){if(validMap(an,forms[sig])){m=forms[sig];how='saved'}else{m=detect(an);how=m?'auto':''}}
    let built=null;
    if(m){try{built=await buildProject(an,m,fileName)}catch(e){m=null}}
    if(!built){done();done=()=>{};
      const init=forceMap&&P&&validMap(an,P.map)?P.map:(m||detect(an)||guessInitial(an));
      m=await mapDialog(an,init);if(!m)return;how='manual';done=busy('엑셀 읽는 중…');built=await buildProject(an,m,fileName)}
    forms[sig]=m;ls.set('ip.forms',JSON.stringify(forms));
    const{project,existing}=built;
    await dclear('photos');for(const u of urls.values())URL.revokeObjectURL(u);urls.clear();have.clear();
    for(const ex of existing){try{const b=await compress(new Blob([ex.ab]),'');await dput('photos',ex.k,b);have.add(ex.k)}catch(e){}}
    P=project;BUF=buf;await dput('meta','buf',buf);await saveMeta();done();done=()=>{};renderAll();
    const what=`${P.photo.sheet} 시트 · 사진 ${P.photo.cols.length}칸`;
    if(P.hasUser&&users().includes(author))toast(`${author} 품목 ${mine().length}건을 불러왔어요 (${what})`);
    else if(!P.hasUser&&author)toast(`품목 ${P.items.length}건을 불러왔어요 (${what})`);
    else if(how==='auto')toast(`양식을 자동으로 인식했어요 (${what})`)}
  catch(err){console.error(err);done();done=()=>{};
    sheet(`<h3>불러오지 못했어요</h3><p>${esc(err.message||err)}</p><div class="row"><button class="btn ghost" data-a="x">닫기</button><button class="btn primary" data-a="map">양식 직접 설정</button></div>`,(el,c)=>el.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;c();if(a==='map')openWorkbook(buf,fileName,true)}))}
  finally{done()}
}
function confirmReset(title,go){if(P&&have.size)sheet(`<h3>${title}</h3><p>지금 찍어둔 사진 ${have.size}장이 지워지고 엑셀 기준으로 다시 시작해요. 먼저 엑셀 저장을 했는지 확인해주세요.</p><div class="row"><button class="btn ghost" data-a="x">취소</button><button class="btn danger" data-a="ok">계속</button></div>`,(el,c)=>el.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;c();if(a==='ok')go()}));else go()}
async function loadFile(file){
  if(!/\.xlsx$/i.test(file.name)){toast('.xlsx 파일만 불러올 수 있어요');return}
  confirmReset('새 엑셀을 불러올까요?',async()=>{try{openWorkbook(await file.arrayBuffer(),file.name,false)}catch(e){toast('파일을 읽지 못했어요')}});
}

async function save(mode){
  if(!author){pickAuthor();return}
  const miss=mine().filter(i=>!isDone(i)).length;
  const run=async()=>{const done=busy('엑셀 만드는 중…');
    try{const blob=await buildXlsx();const name=outName();const file=new File([blob],name,{type:blob.type});
      const mb=blob.size<1048576?Math.max(1,Math.round(blob.size/1024))+'KB':(blob.size/1048576).toFixed(1)+'MB';
      const NB=window.AndroidBridge;const canShare=!!NB||!!(navigator.canShare&&navigator.canShare({files:[file]}));
      const shareText=`${P.title} ${(P.date||'').slice(5,7).replace(/^0/,'')}월 점검사진 (${author})`;
      const shareFirst=mode==='share'&&canShare;
      const bShare=`<button class="btn ${shareFirst?'primary':'ghost'}" data-a="sh"${canShare?'':' disabled'}>카톡·메일로 공유</button>`,bSave=`<button class="btn ${shareFirst?'ghost':'primary'}" data-a="dl">파일 저장</button>`;
      sheet(`<h3>엑셀을 만들었어요</h3><p>${esc(name)} · ${mb}</p><div class="row">${shareFirst?bShare+bSave:bSave+bShare}</div>${canShare?'':'<p style="font-size:13px">이 브라우저는 파일 공유를 지원하지 않아요. 파일 저장 후 카카오톡에서 첨부해주세요. (휴대폰 크롬·사파리에서는 공유가 돼요)</p>'}<button class="btn ghost" data-a="x">닫기</button>`,
        (el,c)=>el.addEventListener('click',async e=>{const a=e.target.dataset.a;if(!a)return;
          if(a==='dl'&&NB){NB.saveFile(await toB64(blob),name,blob.type)}
          else if(a==='sh'&&NB){NB.shareFile(await toB64(blob),name,blob.type,shareText);c()}
          else if(a==='dl'){const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('저장했어요')}
          else if(a==='sh'){try{await navigator.share({files:[file],title:name,text:shareText});c()}catch(err){if(err&&err.name!=='AbortError')toast('공유하지 못했어요. 파일 저장 후 직접 첨부해주세요.')}}
          else c()}))}
    catch(err){console.error(err);toast('엑셀을 만들지 못했어요: '+(err.message||err))}finally{done()}};
  if(miss){sheet(`<h3>사진이 빠진 품목이 ${miss}개 있어요</h3><p>그대로 저장하면 해당 칸은 비어 있어요.</p><div class="row"><button class="btn ghost" data-a="x">계속 찍기</button><button class="btn primary" data-a="ok">그대로 저장</button></div>`,(el,c)=>el.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;c();if(a==='ok')run()}))}
  else run();
}

const toB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
window.onNativeSaved=ok=>toast(ok?'저장했어요':'저장하지 못했어요. 다시 시도해주세요.');
window.onAndroidBack=()=>{const L=$('layer');if(L.lastElementChild){L.lastElementChild.remove();return true}return false};
async function shareLink(){const url=location.href.split('#')[0];
  if(navigator.share&&/^https?:/.test(url)){try{await navigator.share({title:'기계기구 점검사진',text:'유해위험 기계기구 점검사진 정리 앱',url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('앱 링크를 복사했어요')}catch(e){sheet(`<h3>앱 링크</h3><p style="user-select:all">${esc(url)}</p><button class="btn ghost" data-a="x">닫기</button>`,(el,c)=>el.addEventListener('click',ev=>ev.target.dataset.a&&c()))}}
function openMenu(){sheet(`<h3>메뉴</h3><p>${esc(P.fileName)}</p><button class="btn ghost" data-a="who">작성자 변경</button>${window.AndroidBridge?'':'<button class="btn ghost" data-a="link">앱 링크 공유</button>'}<button class="btn ghost" data-a="new">다른 엑셀 불러오기</button><button class="btn ghost" data-a="form">양식 설정 변경</button><button class="btn ghost" data-a="upd">업데이트 확인 (현재 v${APP_VERSION})</button><button class="btn ghost" data-a="clr">사진 모두 지우기</button><button class="btn ghost" data-a="x">닫기</button>`,
  (el,c)=>el.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;c();
    if(a==='who')pickAuthor();
    else if(a==='link')shareLink();
    else if(a==='new'){$('xlsxIn').value='';$('xlsxIn').click()}
    else if(a==='upd')checkUpdate(true);
    else if(a==='form')confirmReset('양식을 다시 설정할까요?',()=>openWorkbook(BUF,P.fileName,true));
    else if(a==='clr')sheet(`<h3>사진을 모두 지울까요?</h3><p>찍어둔 사진 ${have.size}장이 삭제돼요. 되돌릴 수 없어요.</p><div class="row"><button class="btn ghost" data-a="x">취소</button><button class="btn danger" data-a="ok">모두 지우기</button></div>`,(el2,c2)=>el2.addEventListener('click',async e2=>{const b=e2.target.dataset.a;if(!b)return;c2();if(b==='ok'){await dclear('photos');for(const u of urls.values())URL.revokeObjectURL(u);urls.clear();have.clear();renderAll();toast('사진을 모두 지웠어요')}}))}))}

/* ---------- events ---------- */
$('pickBtn').onclick=()=>{$('xlsxIn').value='';$('xlsxIn').click()};
$('xlsxIn').onchange=e=>{const f=e.target.files[0];if(f)loadFile(f)};
$('camIn').onchange=onPhoto;$('galIn').onchange=onPhoto;
$('menuBtn').onclick=openMenu;$('saveBtn').onclick=()=>save('save');$('shareBtn').onclick=()=>save('share');
const drop=$('drop');['dragover','dragenter'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,()=>drop.classList.remove('over')));
drop.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)loadFile(f)});
$('dateIn').onchange=e=>{P.date=e.target.value;saveMeta()};
$('whoForm').onsubmit=e=>{e.preventDefault();$('authorIn').blur();const v=$('authorIn').value;const u=matchUser(v);if(u){setAuthor(u);toast(`${u} 대상 ${mine().length}건`)}else if(v.trim())toast(`"${v.trim()}" 이름의 대상 품목이 없어요`);else pickAuthor()};

$('q').addEventListener('input',e=>{query=e.target.value;renderList()});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
$('onlyTodo').onchange=e=>{onlyTodo=e.target.checked;ls.set('ip.todo',onlyTodo?'1':'0');renderList()};
$('list').addEventListener('click',e=>{const card=e.target.closest('.item');if(!card)return;const it=itemById(card.dataset.id);
  const slot=e.target.closest('.slot');if(slot){openSlot(it,+slot.dataset.slot);return}
  const r=e.target.closest('[data-res]');if(r){const st=P.status[it.id];st.result=r.dataset.res;saveMeta();
    card.classList.toggle('bad',st.result==='불량');card.querySelectorAll('[data-res]').forEach(b=>b.setAttribute('aria-pressed',b===r));
    const n=card.querySelector('.note');if(n){n.hidden=st.result!=='불량';if(!n.hidden)n.focus()}}});
$('list').addEventListener('input',e=>{if(!e.target.classList.contains('note'))return;const it=itemById(e.target.closest('.item').dataset.id);P.status[it.id].note=e.target.value;saveMeta()});

/* ---------- update check ---------- */
const APP_VERSION='1.7', APP_CODE=8;
const UPDATE_URL='https://thkim3589-web.github.io/zero/apk/version.json';
let updShown=false, lastCheck=0;
async function checkUpdate(manual){
  lastCheck=Date.now();
  let info;
  try{const r=await fetch(UPDATE_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;info=await r.json()}
  catch(e){if(manual)toast('업데이트 정보를 확인하지 못했어요. 인터넷 연결을 확인해주세요.');return}
  if(!(info&&+info.code>APP_CODE)){if(manual)toast(`최신 버전이에요 (v${APP_VERSION})`);return}
  if(updShown&&!manual)return;updShown=true;
  const isApp=!!window.AndroidBridge;
  const notes=(info.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('');
  sheet(`<h3>새 버전이 나왔어요</h3><p>v${esc(APP_VERSION)} → <b style="color:var(--accent)">v${esc(info.version)}</b></p>
    ${notes?`<ul style="margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:2px">${notes}</ul>`:''}
    <p style="font-size:13px">${isApp?'업데이트를 누르면 새 APK를 받아요. 받은 파일을 눌러 설치하면 찍어둔 사진은 그대로 남아요.':'업데이트를 누르면 새 버전으로 다시 열려요. 찍어둔 사진은 그대로 남아요.'}</p>
    <div class="row"><button class="btn ghost" data-a="x">나중에</button>${isApp?`<a class="btn primary" style="display:grid;place-items:center;text-decoration:none" href="${esc(info.apk)}" data-a="go">업데이트</a>`:'<button class="btn primary" data-a="reload">업데이트</button>'}</div>`,
    (el,c)=>el.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;
      if(a==='reload'){location.replace(location.pathname+'?v='+info.code)}
      else if(a==='go'){setTimeout(c,300)}
      else c()}));
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastCheck>3*3600e3)checkUpdate(false)});
(async function init(){try{const p=await dget('meta','project'),b=await dget('meta','buf');if(p&&b){P=p;BUF=b;for(const k of await dkeys('photos'))have.add(k);
    if(P.items.some(i=>i.id===undefined)){P.items.forEach(i=>i.id=i.no);if(P.hasUser===undefined)P.hasUser=P.items.some(i=>i.user);
      if(P.check&&!P.check.rowOf){const ro={};P.items.forEach(i=>{if(P.check.rowsByNo&&P.check.rowsByNo[i.no])ro[i.id]=P.check.rowsByNo[i.no]});P.check.rowOf=ro}saveMeta()}}}catch(e){console.error(e)}renderAll();setTimeout(()=>checkUpdate(false),1500)})();
</script>
</body>
